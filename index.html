<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Teacher Toolbox 🧰</title>
<style>
  :root {
    --ink: #0f172a;
    --muted: #64748b;
    --card: #ffffff;
    --line: #e2e8f0;
    --indigo: #4f46e5;
    --teal: #0d9488;
  }

  * { box-sizing: border-box; }

  html, body { min-height: 100%; }

  body {
    margin: 0;
    padding: 40px 20px 56px;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
                 "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(1100px 600px at 8% -12%, #dbeafe 0%, transparent 60%),
      radial-gradient(900px 500px at 102% -6%, #ede9fe 0%, transparent 55%),
      linear-gradient(160deg, #eef2ff 0%, #e0f2fe 100%);
    background-attachment: fixed;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    width: 100%;
    max-width: 880px;
    animation: rise .5s ease both;
  }

  /* ---------- Header ---------- */
  header {
    text-align: center;
    margin-bottom: 38px;
  }

  .logo {
    font-size: 54px;
    line-height: 1;
    display: inline-block;
    filter: drop-shadow(0 8px 14px rgba(79, 70, 229, .22));
    animation: float 5s ease-in-out infinite;
  }

  h1 {
    margin: 14px 0 8px;
    font-size: clamp(1.9rem, 4.5vw, 2.6rem);
    letter-spacing: -0.02em;
    font-weight: 800;
  }

  .tagline {
    margin: 0;
    color: var(--muted);
    font-size: 1rem;
  }

  /* ---------- Cards ---------- */
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }

  .card {
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 26px 24px 22px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    text-decoration: none;
    color: inherit;
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(15, 23, 42, .05),
                0 10px 24px -14px rgba(15, 23, 42, .25);
    transition: transform .22s ease, box-shadow .22s ease, border-color .22s ease;
  }

  /* Accent bar */
  .card::before {
    content: "";
    position: absolute;
    inset: 0 0 auto 0;
    height: 5px;
    background: var(--accent);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform .28s ease;
  }

  .card:hover,
  .card:focus-visible {
    transform: translateY(-5px);
    border-color: color-mix(in srgb, var(--accent) 45%, var(--line));
    box-shadow: 0 4px 8px rgba(15, 23, 42, .06),
                0 24px 40px -20px color-mix(in srgb, var(--accent) 55%, transparent);
    outline: none;
  }

  .card:hover::before,
  .card:focus-visible::before { transform: scaleX(1); }

  .card:focus-visible {
    outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent);
    outline-offset: 3px;
  }

  .icon {
    width: 52px;
    height: 52px;
    display: grid;
    place-items: center;
    font-size: 26px;
    border-radius: 14px;
    background: color-mix(in srgb, var(--accent) 12%, #fff);
    margin-bottom: 4px;
  }

  .card h2 {
    margin: 0;
    font-size: 1.25rem;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  .card p {
    margin: 0;
    color: var(--muted);
    font-size: .92rem;
    line-height: 1.5;
    flex: 1;
  }

  .launch {
    margin-top: 8px;
    font-size: .9rem;
    font-weight: 650;
    color: var(--accent);
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .launch .arrow {
    transition: transform .22s ease;
  }

  .card:hover .launch .arrow,
  .card:focus-visible .launch .arrow { transform: translateX(4px); }

  /* Keyboard hint badge */
  kbd {
    position: absolute;
    top: 16px;
    right: 16px;
    font-family: inherit;
    font-size: .72rem;
    font-weight: 700;
    color: var(--muted);
    background: #f8fafc;
    border: 1px solid var(--line);
    border-bottom-width: 2px;
    border-radius: 7px;
    padding: 2px 8px;
    line-height: 1.5;
  }

  /* ---------- Footer ---------- */
  footer {
    margin-top: 30px;
    text-align: center;
    font-size: .82rem;
    color: var(--muted);
  }

  footer kbd {
    position: static;
    font-size: .75rem;
    padding: 1px 6px;
    margin: 0 1px;
  }

  /* ---------- Animations ---------- */
  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: none; }
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-7px); }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation: none !important;
      transition: none !important;
    }
  }

  @media (max-width: 640px) {
    .grid { grid-template-columns: 1fr; }
    body { padding-top: 28px; }
    header { margin-bottom: 28px; }
  }
</style>
</head>
<body>

<main class="wrap">
  <header>
    <div class="logo" aria-hidden="true">🧰</div>
    <h1>Teacher Toolbox</h1>
    <p class="tagline">Everything you need, one click away.</p>
  </header>

  <nav class="grid" aria-label="Toolbox tools">

    <a class="card"
       href="https://juliandcolediverti.github.io/Toolbox/ClassPass.html"
       target="_blank" rel="noopener"
       data-key="1"
       style="--accent: var(--indigo);">
      <kbd>1</kbd>
      <span class="icon" aria-hidden="true">🎟️</span>
      <h2>ClassPass</h2>
      <p>Manage passes, sign-outs, and classroom movement in a snap.</p>
      <span class="launch">Open ClassPass <span class="arrow" aria-hidden="true">→</span></span>
    </a>

    <a class="card"
       href="https://juliandcolediverti.github.io/Toolbox/NoteCalc.html"
       target="_blank" rel="noopener"
       data-key="2"
       style="--accent: var(--teal);">
      <kbd>2</kbd>
      <span class="icon" aria-hidden="true">🧮</span>
      <h2>NoteCalc</h2>
      <p>Jot notes and crunch grades side by side, without the clutter.</p>
      <span class="launch">Open NoteCalc <span class="arrow" aria-hidden="true">→</span></span>
    </a>

  </nav>

  <footer>
    Tip: press <kbd>1</kbd> or <kbd>2</kbd> to launch a tool instantly.
  </footer>
</main>

<script>
  // Keyboard shortcuts: 1 / 2 launch the matching tool.
  document.addEventListener('keydown', (event) => {
    if (event.metaKey || event.ctrlKey || event.altKey || event.repeat) return;

    const card = document.querySelector(`.card[data-key="${event.key}"]`);
    if (card) {
      event.preventDefault();
      card.click();
    }
  });
</script>

</body>
</html>
